name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lints"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # ember-search-ui-views type-checks against ember-search-ui's declarations
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint

  test:
    name: "Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Tests
        run: pnpm test

  floating:
    name: "Floating Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --no-lockfile
      - name: Run Tests
        run: pnpm test

  try-scenarios:
    name: ${{ matrix.package }} / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    needs: "test"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [ember-search-ui, ember-search-ui-views]
        # see each package's .try.mjs
        scenario:
          - ember-lts-5.8
          - ember-lts-5.12
          - ember-lts-6.4
          - ember-latest
          - ember-beta
          - ember-alpha

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply Scenario
        working-directory: packages/${{ matrix.package }}
        run: pnpm dlx @embroider/try apply ${{ matrix.scenario }}
      - name: Install Dependencies
        run: pnpm install --no-lockfile
      - name: Build ember-search-ui
        run: pnpm --filter ember-search-ui build
      - name: Run Tests
        working-directory: packages/${{ matrix.package }}
        run: pnpm test
        env:
          # Ember 5.x scenarios run through the classic (compat) build
          ENABLE_COMPAT_BUILD: ${{ startsWith(matrix.scenario, 'ember-lts-5') && 'true' || '' }}
